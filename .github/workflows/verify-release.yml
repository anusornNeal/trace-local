name: Verify release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package unpacked desktop app
        run: npm run package:dir

      - name: Smoke packaged structure
        run: npm run package:smoke

      - name: Upload verification package
        uses: actions/upload-artifact@v4
        with:
          name: tracelocal-${{ runner.os }}-${{ runner.arch }}
          path: release/
          if-no-files-found: error
          retention-days: 7
