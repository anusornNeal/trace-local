appId: com.tracelocal.desktop
productName: Trace Local
copyright: Copyright © 2026 Trace Local

directories:
  output: release

extraResources:
  - from: scripts/installer/windows-firewall.ps1
    to: installer/windows-firewall.ps1

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

asar: true
npmRebuild: false

win:
  target:
    - nsis
  artifactName: "${productName}-${version}-${arch}-setup.${ext}"
  signExecutable: false

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  include: scripts/installer/windows-firewall.nsh

mac:
  target:
    - dmg
    - zip
  identity: null
  category: public.app-category.developer-tools
  artifactName: "${productName}-${version}-${arch}.${ext}"
